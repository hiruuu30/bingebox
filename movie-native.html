<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <meta name="description" content="Browse and watch movies on BingeBox Movies.">
  <title>BingeBox Movies — Watch Movies Online</title>
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/movie-native.css">
</head>
<body>
  <div class="native-shell">
    <header class="native-header">
      <div class="native-header-inner">
        <a class="native-brand" href="/" data-link aria-label="BingeBox home">BingeBox</a>
        <nav class="native-desktop-nav" aria-label="Main navigation">
          <a href="/movies" data-link>Movies</a>
          <a href="/tv" data-link>TV Shows</a>
          <a href="/search" data-link>Search</a>
        </nav>
        <div class="native-header-actions">
          <a class="native-icon-btn" href="/watchlist" data-link aria-label="Watchlist" title="Watchlist">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
          </a>
          <button class="native-icon-btn" id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="app" class="native-main" aria-live="polite">
      <div class="native-spinner" aria-label="Loading"></div>
    </main>

    <footer class="native-footer">
      <div>
        <div class="native-footer-brand">BINGEBOX</div>
        <p>Movies powered by the BingeBox catalog. Playback availability may vary by provider.</p>
      </div>
      <div class="native-footer-links">
        <a href="/" data-link>Home</a>
        <a href="/movies" data-link>Movies</a>
        <a href="/search" data-link>Search</a>
      </div>
    </footer>

    <nav class="native-mobile-nav" aria-label="Mobile navigation">
      <a href="/" data-link><span>⌂</span>Home</a>
      <a href="/movies" data-link><span>▣</span>Movies</a>
      <a href="/search" data-link><span>⌕</span>Search</a>
      <a href="/watchlist" data-link><span>♡</span>Saved</a>
    </nav>
  </div>

  <script type="module" src="/movie-native.js"></script>
</body>
</html>
